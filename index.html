<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32-A1 Audio Lab · v0.5.0</title><link rel="stylesheet" href="style.css"></head>
<body><script>try{const t=localStorage.getItem('a1-lab-theme');if(['graphite','ocean','pine','ember'].includes(t))document.documentElement.dataset.theme=t;}catch{}</script>
<header class="topbar"><div class="brand"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><strong>A1 Audio Lab</strong><span class="version">v0.5.0</span></div><div class="segment" aria-label="框图复杂度"><button data-mode="simple" aria-pressed="true">简易</button><button data-mode="pro" aria-pressed="false">专业</button></div><label class="theme-picker"><span>主题</span><select id="themeSelect" aria-label="界面主题"><option value="light">浅色</option><option value="graphite">石墨</option><option value="ocean">深海</option><option value="pine">松墨</option><option value="ember">暖夜</option></select></label><label class="language-picker"><span>语言</span><select id="languageSelect" aria-label="Language / 语言" data-no-i18n><option value="zh">简体中文</option><option value="en">English</option></select></label><div class="connection"><span id="connectionText"><i class="dot"></i>未连接设备</span><button class="primary" id="connect">连接开发板</button><button class="plain" id="tools">文件与工具 ···</button></div></header>
<main><section class="workspace-heading"><div><span class="eyebrow">ESP32-A1 / AUDIO WORKBENCH</span><h1>四路采集，双声道播放。</h1><p>点击模块设置或开始监测，设备状态自动同步。</p></div><div class="view-controls"><div class="segment" aria-label="状态来源"><button data-source="draft" aria-pressed="true">配置草稿</button><button data-source="device" aria-pressed="false">设备应答</button></div><div id="formatText">48.0 kHz · 24 bit · 4 MIC</div></div></section>
<div class="status-strip"><span id="sourceNote">草稿预览 · 尚未下发</span><span id="deviceMeta">固件：未读取</span><button id="pendingDraftButton" class="draft-count" disabled>待写入 <b id="pendingCount">0</b></button><span id="liveSync" role="status">设备未连接</span><button id="refresh" class="plain">读取配置</button></div>
<section id="workspaceNotice" class="workspace-notice" hidden aria-live="polite"><div><strong id="workspaceStatus"></strong><span id="workspaceHint"></span></div><button id="workspaceLog" class="plain" hidden>查看记录</button></section><div class="graph-scroll" id="graphScroll"><div id="graph"></div></div>
<section id="wavePanel" class="wave-panel" hidden aria-label="实时音频波形"><div class="resize-handle resize-left" role="separator" aria-orientation="vertical" aria-label="调整波形窗口宽度" tabindex="0" data-resize="wave"></div><div class="wave-head"><div><span class="wave-live-dot"></span><span class="eyebrow">LIVE PCM</span><h3 id="waveTitle">实板波形</h3></div><select id="waveChannel" aria-label="波形通道"></select><button id="stopWave" class="plain">停止</button><button id="closeWave" class="icon" aria-label="关闭波形">×</button></div><div class="wave-time-control"><label for="timeWindow">时间窗 <output id="timeWindowValue">50 ms</output></label><input id="timeWindow" type="range" min="5" max="10000" step="1" value="50" aria-label="波形时间范围（毫秒）"><label class="time-number"><input id="timeNumber" type="number" min="5" max="10000" step="1" value="50" aria-label="时间窗数值（毫秒）"><span>ms</span></label></div><div class="wave-reading"><strong id="waveLevel">— dBFS</strong><span>RMS · 数字满量程</span></div><div class="wave-scale-row"><div id="waveScale" class="wave-scale">纵轴自动</div><button id="autoScale" class="plain" aria-pressed="true" title="恢复纵轴自动缩放">自动</button><span>滚轮缩放</span></div><canvas id="waveCanvas" width="800" height="180" aria-label="实板 PCM 波形"></canvas><div class="wave-time-axis"><span id="timeAxisStart">−50 ms</span><span>实时</span></div><div id="waveMeta">点击开始后读取实板 PCM</div></section><aside id="inspector" class="inspector" hidden aria-label="模块设置"><div class="resize-handle resize-right" role="separator" aria-orientation="vertical" aria-label="调整设置窗口宽度" tabindex="0" data-resize="inspector"></div><div class="inspector-heading"><div><span class="eyebrow" id="panelCategory">MODULE SETTINGS</span><h2 id="panelTitle"></h2></div><button class="icon" id="closePanel" aria-label="关闭设置">×</button></div><section id="moduleDraft" class="module-draft" hidden></section><div id="panelBody" class="panel-body"></div><div class="panel-footer"><div id="operationStatus" role="status" aria-live="polite">修改保存在草稿中，写入需要连接兼容的 a1_cli。</div><button id="apply" class="primary" hidden>写入此模块</button></div></aside>
<div id="toolMenu" class="tool-menu" hidden><button id="showConnection">连接与板卡</button><button id="showRegisters">寄存器</button><button id="showLog">通信记录</button><button id="exportConfig">导出配置</button><button id="importConfig">导入配置</button><button id="exportLog">导出通信记录</button></div>
<footer class="legend"><span><i class="line teal"></i>采集</span><span><i class="line amber"></i>播放</span><span><i class="line purple"></i>VAD</span><span><i class="line blue"></i>回采</span><span><i class="line dashed"></i>未启用 / 未知</span><label class="trace-option"><input id="highlightPath" type="checkbox" checked>选中链路高亮</label><span class="legend-note">链路跟随设备状态；波形来自实板 PCM。</span><button class="icon" id="zoomOut" aria-label="缩小框图">−</button><span id="zoomText">100%</span><button class="icon" id="zoomIn" aria-label="放大框图">+</button><button class="plain" id="fit">适合窗口</button></footer>
</main><input type="file" id="configFile" accept="application/json,.json" hidden><script type="module" src="app.mjs"></script></body></html>
